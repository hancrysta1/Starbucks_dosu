<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div class="result">

</div>

<button class="btn1">CALL SERVER</button>
<!-- <script src="https://unpkg.com/axios/dist/axios.min.js"></script> -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
 
<script>

    const callServer = async() => {
        console.log("call server 1...")
        const accessToken = localStorage.getItem("accessToken")

        if(!accessToken) {
            throw 'Cannot Find Access Token'
        }
console.log("call server 2...")
        const authHeader = {"Authorization": `Bearer ${accessToken}`}
        
        try {
         const res = await axios.get("http://localhost:8888/order",
                {headers: authHeader})
            return res.data
        }catch(err) {
console.log(err)
            if(err.response.data.msg === 'Expired Token'){ //accesstoken만료시
                console.log("Refresh Your Token")

                try{
                    await callRefresh()//새로운 토큰저장 
                    console.log("new tokens....saved..") 
                    return callServer() //다시 원래기능호출

                }catch(refreshErr){
                    // refreshtoken이 만료되면 
                    // 새로운 access token을 발행할 수 없기 때문에 사용자에게 step1.부터(/apiLogin.html) 다시 시작해야함을 알려주어야
                    throw refreshErr.response.data.msg 
                }
            }//end if
        }
    }

    const callRefresh = async () => {

        const accessToken = localStorage.getItem("accessToken")
        const refreshToken = localStorage.getItem("refreshToken")

        const tokens = {accessToken, refreshToken}
        const res = await axios.post("http://localhost:8888/refreshToken", tokens)
        localStorage.setItem("accessToken", res.data.accessToken)
        localStorage.setItem("refreshToken", res.data.refreshToken)
    }


    const resultDiv = document.querySelector(".result")

    document.querySelector(".btn1").addEventListener("click", () => {

        callServer().then(result => {
            console.log(result)
        }).catch(error => {
            alert(error)
        })
    },false)

</script>

</body>
</html>
